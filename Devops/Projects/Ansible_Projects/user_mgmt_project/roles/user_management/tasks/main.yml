---
- name: Create group
  ansible.builtin.group:
    name: "{{group}}"

- name: Create user and add to group
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: "{{ group}}"
    append: yes
    state: present
  loop: "{{users}}"

- name: Add ssh key for user
  ansible.builtin.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ lookup('file', 'files/ssh_keys/'+ item.ssh_key) }}"
  loop: "{{users}}"

- name: add sudo access for group
  ansible.builtin.copy:
    dest: "/etc/suddoers.d/{{item.name}}" 
    content: "{{ item.name}} ALL=(ALL) NOPASSWD: ALL}}" 
    mode: '0440'
  loop: "{{users}}"


    
            